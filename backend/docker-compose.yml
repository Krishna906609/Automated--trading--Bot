services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: asteria
      POSTGRES_PASSWORD: change-me-in-local-only
      POSTGRES_DB: asteria
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asteria -d asteria"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
volumes:
  postgres-data: